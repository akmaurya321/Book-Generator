spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.flyway.ignore-migration-patterns=

app.security.google.enabled=true
app.security.password-reset.enabled=${PASSWORD_RESET_ENABLED:false}
app.security.jwt.secret=${JWT_SECRET}
app.security.cookie.secure=true
app.debug-endpoints.enabled=false
app.storage.root=${APP_STORAGE_PATH}
app.jobs.recovery.enabled=true
app.jobs.stale-threshold-minutes=${JOB_STALE_THRESHOLD_MINUTES:30}
app.jobs.max-recovery-attempts=${JOB_MAX_RECOVERY_ATTEMPTS:2}
chroma.base-url=${CHROMA_BASE_URL}
github.token=${GITHUB_TOKEN:}
github.clone-timeout-seconds=${GITHUB_CLONE_TIMEOUT_SECONDS:300}
app.public-url=${APP_PUBLIC_URL}
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.test-connection=${SPRING_MAIL_TEST_CONNECTION:false}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:false}
management.health.mail.enabled=${MANAGEMENT_HEALTH_MAIL_ENABLED:false}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

#ai.api-key=${AI_API_KEY}

server.error.include-message=never
server.error.include-stacktrace=never