# APPLICATION

spring.application.name=Book-generator-project
spring.profiles.default=dev
spring.config.import=optional:file:.env[.properties]

server.port=8080


# FILE UPLOAD

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=22MB


# SPRING DEVTOOLS

spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false


# GOOGLE OAUTH

spring.security.oauth2.client.registration.google.scope=openid,email,profile


# DATABASE / JPA

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


# FLYWAY

spring.flyway.ignore-migration-patterns=versioned:missing


# AI PROVIDER

# Legacy single-provider settings.
# These remain useful for embeddings and as the fallback when no LLM_* provider
# slot is configured. For chapter generation, prefer the LLM_1..LLM_4 settings below.

ai.provider=${AI_PROVIDER:ollama}
ai.api-key=${AI_API_KEY:}
ai.chat-model=${AI_CHAT_MODEL:qwen3:8b}
ai.embedding-model=${AI_EMBEDDING_MODEL:bge-m3}
ai.base-url=${AI_BASE_URL:http://localhost:11434}
ai.embedding-base-url=${AI_EMBEDDING_BASE_URL:${AI_BASE_URL:http://localhost:11434}}
app.generation.allow-invalidated-sections=${ALLOW_INVALIDATED_SECTIONS:false}


# GENERIC LLM WORKER POOL

# The backend automatically detects configured provider slots.
# Empty slots are ignored. You can configure 1, 2, 3 or 4 providers only
# by changing .env. No Java code change is needed for these four supported types:
# ollama, openai, gemini, huggingface.
#
# Each configured provider gets exactly one worker. The existing worker pool,
# retry, cooldown and recovery logic is reused.

llm.retry-backoff-ms=${LLM_RETRY_BACKOFF_MS:1500}
llm.provider-cooldown-ms=${LLM_PROVIDER_COOLDOWN_MS:10000}
llm.max-provider-attempts=${LLM_MAX_PROVIDER_ATTEMPTS:${LLM_MAX_CHAPTER_ATTEMPTS:3}}
llm.connection-timeout-ms=${LLM_CONNECTION_TIMEOUT_MS:15000}
llm.read-timeout-ms=${LLM_READ_TIMEOUT_MS:180000}


# LLM PROVIDER 1

llm.providers[0].name=${LLM_PROVIDER_1_NAME:provider-1}
llm.providers[0].provider=${LLM_PROVIDER_1:}
llm.providers[0].model=${LLM_MODEL_1:}
llm.providers[0].base-url=${LLM_BASE_URL_1:}
llm.providers[0].api-key=${LLM_API_KEY_1:}
llm.providers[0].enabled=${LLM_ENABLED_1:true}
llm.providers[0].structured-output=${LLM_STRUCTURED_OUTPUT_1:auto}


# LLM PROVIDER 2

llm.providers[1].name=${LLM_PROVIDER_2_NAME:provider-2}
llm.providers[1].provider=${LLM_PROVIDER_2:}
llm.providers[1].model=${LLM_MODEL_2:}
llm.providers[1].base-url=${LLM_BASE_URL_2:}
llm.providers[1].api-key=${LLM_API_KEY_2:}
llm.providers[1].enabled=${LLM_ENABLED_2:true}
llm.providers[1].structured-output=${LLM_STRUCTURED_OUTPUT_2:auto}


# LLM PROVIDER 3

llm.providers[2].name=${LLM_PROVIDER_3_NAME:provider-3}
llm.providers[2].provider=${LLM_PROVIDER_3:}
llm.providers[2].model=${LLM_MODEL_3:}
llm.providers[2].base-url=${LLM_BASE_URL_3:}
llm.providers[2].api-key=${LLM_API_KEY_3:}
llm.providers[2].enabled=${LLM_ENABLED_3:true}
llm.providers[2].structured-output=${LLM_STRUCTURED_OUTPUT_3:auto}


# LLM PROVIDER 4

llm.providers[3].name=${LLM_PROVIDER_4_NAME:provider-4}
llm.providers[3].provider=${LLM_PROVIDER_4:}
llm.providers[3].model=${LLM_MODEL_4:}
llm.providers[3].base-url=${LLM_BASE_URL_4:}
llm.providers[3].api-key=${LLM_API_KEY_4:}
llm.providers[3].enabled=${LLM_ENABLED_4:true}
llm.providers[3].structured-output=${LLM_STRUCTURED_OUTPUT_4:auto}


# SUPPORTED PROVIDER TYPES

# Ollama:
# LLM_PROVIDER_1=ollama
# LLM_MODEL_1=qwen3:8b
# LLM_BASE_URL_1=http://localhost:11434
# LLM_API_KEY_1=

# OpenAI:
# LLM_PROVIDER_2=openai
# LLM_MODEL_2=gpt-4.1-mini
# LLM_BASE_URL_2=https://api.openai.com/v1
# LLM_API_KEY_2=your-openai-api-key

# Gemini:
# LLM_PROVIDER_3=gemini
# LLM_MODEL_3=gemini-3-flash-preview
# LLM_BASE_URL_3=https://generativelanguage.googleapis.com/v1beta
# LLM_API_KEY_3=your-gemini-api-key

# Hugging Face:
# LLM_PROVIDER_4=huggingface
# LLM_MODEL_4=Qwen/Qwen3-4B-Instruct-2507
# LLM_BASE_URL_4=https://router.huggingface.co/v1
# LLM_API_KEY_4=your-huggingface-token


# CHROMA VECTOR DATABASE

chroma.base-url=${CHROMA_BASE_URL:http://localhost:8000}


# GITHUB

github.token=${GITHUB_TOKEN:}
github.clone-timeout-seconds=${GITHUB_CLONE_TIMEOUT_SECONDS:300}


# APPLICATION PUBLIC URL

app.public-url=${APP_PUBLIC_URL:http://localhost:8080}

# EMAIL / PASSWORD RESET

password-reset.enabled=${PASSWORD_RESET_ENABLED:false}

spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}

spring.mail.test-connection=false

spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:false}

# Do not check SMTP server during application health check
management.health.mail.enabled=false



# MERMAID

mermaid.command=mmdc
app.jobs.recovery-retry-delay-millis=${APP_JOBS_RECOVERY_RETRY_DELAY_MILLIS:30000}
