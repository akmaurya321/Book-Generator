# Local-only defaults. Production uses application-prod.properties and required environment secrets.
app.security.google.enabled=${GOOGLE_AUTH_ENABLED:false}
app.security.password-reset.enabled=${PASSWORD_RESET_ENABLED:false}
app.security.jwt.secret=${JWT_SECRET:}
app.security.cookie.secure=false

#google Auth
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:replace-me-with-real-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:replace-me-with-real-google-client-secret}

#database
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/projectbook}
spring.datasource.username=${DATABASE_USERNAME:projectbook}
spring.datasource.password=${DATABASE_PASSWORD}
app.storage.root=${APP_STORAGE_PATH:generated}

# password reset disable now
management.health.mail.enabled=false

#rendering  mermaid
mermaid.command=mmdc